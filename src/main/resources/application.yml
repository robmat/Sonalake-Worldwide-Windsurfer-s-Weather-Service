management:
  endpoints:
    web:
      exposure:
        include: beans,caches,conditions,configprops,env,health,httpexchanges,loggers,info,metrics,threaddump,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: Worldwide-Windsurfer-s-Weather-Service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/default
          jwk-set-uri: http://localhost:9000/default/jwks
springdoc:
  swagger-ui:
    use-root-path: true

weatherbit:
  api:
    key:
    url: https://api.weatherbit.io/v2.0/forecast/daily

resilience4j:
  circuitbreaker:
    instances:
      weatherbit:
        # Number of calls in the sliding window used to calculate the failure rate
        sliding-window-size: 10
        # Percentage of failed calls that will open the circuit (50%)
        failure-rate-threshold: 50
        # Time the circuit breaker stays open before transitioning to half-open state
        wait-duration-in-open-state: 10s
        # Number of calls allowed in half-open state to test if the service has recovered
        permitted-number-of-calls-in-half-open-state: 3
        # Automatically transition from open to half-open state after wait duration
        automatic-transition-from-open-to-half-open-enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level - [%thread] %-45logger{45} : %msg%n"
  level:
    root: DEBUG
    org:
      springframework:
        security: TRACE